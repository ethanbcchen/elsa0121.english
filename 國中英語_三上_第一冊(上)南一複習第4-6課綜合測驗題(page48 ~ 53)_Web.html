<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國中英語會考衝刺測驗系統（Page 48–53 單元複習）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-app: #eef2f6;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.1);
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.65;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .secret-diamond {
      user-select: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .secret-diamond:hover {
      color: var(--primary);
    }

    .main-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .badge-scope {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Timer & Action Controls */
    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 5px 10px;
    }

    .timer-display {
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      min-width: 74px;
      text-align: center;
    }

    .timer-display.danger-time {
      color: var(--danger);
      animation: pulseText 1s infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .timer-input {
      width: 64px;
      padding: 3px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .btn-outline {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--primary-soft);
    }

    .btn-outline.active {
      background: var(--primary);
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Summary & Radar Panel */
    .summary-section {
      max-width: 1600px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: none;
    }

    .summary-section.visible {
      display: block;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 20px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    .score-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 12px;
    }

    .score-num {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-meta {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .dimension-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .dimension-table th,
    .dimension-table td {
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      text-align: left;
    }

    .dimension-table th {
      background: var(--bg-subtle);
      font-weight: 700;
    }

    .chart-box {
      max-width: 360px;
      width: 100%;
      margin: 0 auto;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    /* Dual-Pane Workspace */
    .workspace {
      max-width: 1600px;
      margin: 14px auto 32px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 18px;
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    @media (max-width: 960px) {
      .pane {
        max-height: none;
        overflow-y: visible;
      }
    }

    .pane-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 2px solid var(--primary-soft);
      padding-bottom: 8px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Question Navigator */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .nav-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .nav-btn {
      padding: 6px 0;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn.answered {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .nav-btn.correct-q {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .nav-btn.wrong-q {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    /* Left Pane Reference / Passage Cards */
    .ref-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .ref-card.highlight-flash {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.28);
    }

    .ref-card-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .ref-passage-en {
      font-size: 0.96rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .ref-passage-zh {
      font-size: 0.88rem;
      color: var(--text-secondary);
      border-top: 1px dashed #cbd5e1;
      padding-top: 6px;
    }

    /* Question Cards on Right Pane */
    .q-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .q-card.is-correct {
      border-color: var(--success-border);
      background-color: #f6fef9;
    }

    .q-card.is-wrong {
      border-color: var(--danger-border);
      background-color: #fff8f8;
    }

    .q-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .q-badge {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .q-badge:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .q-tag {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--text-secondary);
    }

    .q-stem {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.15s ease;
      font-size: 0.94rem;
    }

    .option-item:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .option-item.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    .option-item.correct-answer {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success);
      font-weight: 700;
    }

    .option-item.wrong-choice {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 700;
    }

    .option-item.disabled {
      cursor: default;
    }

    /* Detailed Explanation Block */
    .explanation-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .explanation-box.show {
      display: block;
    }

    .exp-line {
      margin-bottom: 6px;
    }

    .exp-label {
      font-weight: 700;
      color: var(--text-main);
    }

    .exp-sublist {
      margin: 4px 0 6px 18px;
      padding: 0;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      max-width: 820px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .history-table,
    .key-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .history-table th,
    .history-table td,
    .key-table th,
    .key-table td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    .history-table th,
    .key-table th {
      background: var(--bg-subtle);
    }

    .toast-notice {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast-notice.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-group">
      <span id="secretDiamond" class="secret-diamond" title="題庫檢視">❖</span>
      <h1 id="mainTitle" class="main-title">國中英語會考衝刺測驗系統</h1>
      <span class="badge-scope">國三｜Page 48–53</span>
    </div>

    <div class="controls-group">
      <div class="timer-box">
        <span>⏱ 倒數</span>
        <span id="timerDisplay" class="timer-display">60:00</span>
        <input id="timerMinutesInput" class="timer-input" type="number" min="0" max="240" value="60" title="設定分鐘數 (0~240)" />
        <button id="applyTimerBtn" class="btn btn-secondary" type="button" style="padding: 4px 8px; font-size: 0.8rem;">設定</button>
        <button id="toggleTimerBtn" class="btn btn-secondary" type="button" style="padding: 4px 8px; font-size: 0.8rem;">暫停</button>
      </div>

      <button id="submitExamBtn" class="btn btn-primary" type="button">提交試卷</button>
      <button id="reshuffleExamBtn" class="btn btn-secondary" type="button">重新測驗(洗牌)</button>
    </div>
  </header>

  <!-- Post-Submission Summary & Radar Panel -->
  <section id="summarySection" class="summary-section" aria-live="polite">
    <div class="summary-card">
      <div class="summary-grid">
        <div>
          <div class="score-banner">
            <span id="finalScoreText" class="score-num">0 分</span>
            <span id="finalStatsText" class="score-meta">答對 0 / 0 題｜耗時 00:00</span>
          </div>
          <div style="font-weight: 700; margin-bottom: 6px;">弱點診斷統計（依考點歸類）</div>
          <table class="dimension-table">
            <thead>
              <tr>
                <th>考點維度</th>
                <th>答對 / 題數</th>
                <th>正確率</th>
              </tr>
            </thead>
            <tbody id="dimensionStatsBody"></tbody>
          </table>
        </div>
        <div class="chart-box">
          <canvas id="radarChartCanvas"></canvas>
        </div>
      </div>

      <div class="post-actions">
        <button id="filterAllBtn" class="btn btn-outline active" type="button">顯示全部</button>
        <button id="filterWrongBtn" class="btn btn-outline" type="button">只看錯題</button>
        <button id="copyWrongMdBtn" class="btn btn-secondary" type="button">一鍵複製錯題筆記（Markdown 格式）</button>
        <button id="downloadWordBtn" class="btn btn-secondary" type="button">下載錯題報告（Word .doc）</button>
      </div>
    </div>
  </section>

  <!-- Dual-Pane Main Content -->
  <main class="workspace">
    <!-- Left Pane: Navigator & Reference Cards / Passages -->
    <section id="leftPane" class="pane">
      <div class="pane-header">
        <span>題號快速導覽與文本對照區</span>
        <span id="progressIndicator" style="font-size: 0.85rem; color: var(--text-secondary);">已作答 0 題</span>
      </div>

      <div id="questionNavGrid" class="nav-grid"></div>
      <div id="referenceCardsContainer"></div>
    </section>

    <!-- Right Pane: Questions & Explanations -->
    <section id="rightPane" class="pane">
      <div class="pane-header">
        <span>測驗作答區</span>
        <span style="font-size: 0.85rem; color: var(--text-secondary);">點擊題號徽章可聯動左側文本</span>
      </div>
      <div id="questionsContainer"></div>
    </section>
  </main>

  <!-- Parent History Modal -->
  <div id="historyModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="historyModalTitle" class="modal-title">歷次測驗歷史紀錄表（家長檢視）</h2>
        <button id="closeHistoryBtn" class="btn btn-secondary" type="button">關閉</button>
      </div>
      <div id="historyContentArea"></div>
    </div>
  </div>

  <!-- Answer & Question Master Key Modal -->
  <div id="masterKeyModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="masterKeyModalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="masterKeyModalTitle" class="modal-title">答案與題目總表（題庫驗證）</h2>
        <button id="closeMasterKeyBtn" class="btn btn-secondary" type="button">關閉</button>
      </div>
      <div id="masterKeyContentArea"></div>
    </div>
  </div>

  <div id="toastNotice" class="toast-notice"></div>

  <script>
    // =========================================================================
    // 題庫資料區（第 1～15 題；第 16～50 題請接續放入陣列）
    // =========================================================================
    const QUESTION_BANK = [
      {
        id: 1,
        section: "一、 核心詞彙與片語運用",
        level: "基礎記憶題",
        dimension: "字彙",
        category: "單字",
        refCardId: "ref-p48-50-vocab",
        stem: "There are many little ______ flying above the trash can. Please take it out right now so the room stays clean.",
        options: ["fans", "rats", "bugs", "planes"],
        answer: "bugs",
        translation: "垃圾桶上方有許多小蟲在飛。請立刻把垃圾拿出去，好讓房間保持乾淨。",
        corePoint: "根據句意「垃圾桶上方飛著（flying above）」與「小（little）」，最符合情境的單字是 bugs（小蟲／昆蟲）。",
        grammarAnalysis: "There are + 複數名詞 (many little bugs) + 現在分詞片語 (flying above the trash can) 作後位修飾，說明飛翔的動作。",
        distractorAnalysis: {
          fans: "電風扇或粉絲，不會成群在垃圾桶上方飛舞，不符合語意。",
          rats: "老鼠通常在地面活動，較少以「flying above（在上方飛）」描述。",
          planes: "飛機體積龐大且在天空飛行，與室內垃圾桶情境完全不合。"
        },
        phonetics: "原句重點：There are many little bugs flying above the trash can. /ðɛr ɑr ˈmɛni ˈlɪtəl bʌɡz ˈflaɪɪŋ əˈbʌv ðə træʃ kæn/；連讀提示：many little 語速快時常見輕彈音 [ɾ]，flying above 可自然連讀。"
      },
      {
        id: 2,
        section: "一、 核心詞彙與片語運用",
        level: "基礎記憶題",
        dimension: "字彙",
        category: "單字",
        refCardId: "ref-p48-50-vocab",
        stem: "There are lots of famous art ______ in that city museum. Let's visit it this afternoon.",
        options: ["works", "minutes", "holidays", "animals"],
        answer: "works",
        translation: "那座市立美術館裡有許多著名的藝術作品。我們今天下午去參觀吧。",
        corePoint: "art works（或 artworks）在此表示「藝術作品」，搭配前方的 famous 與 museum 語意最精確。",
        grammarAnalysis: "There are lots of + 複數名詞 (famous art works) 表示存在許多可數事物；work 作「作品」解時為可數名詞。",
        distractorAnalysis: {
          minutes: "分鐘，與「著名的藝術……」語意無法搭配。",
          holidays: "假期，不符合美術館展品之語境。",

          </article>
        `
      ).join("");
    }

    function highlightRefCard(refCardId) {
      const target = document.getElementById(refCardId);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("highlight-flash");
      void target.offsetWidth;
      target.classList.add("highlight-flash");
      setTimeout(() => {
        target.classList.remove("highlight-flash");
      }, 1400);
    }

    function updateProgressText() {
      const answeredCount = Object.keys(userAnswers).length;
      progressIndicator.textContent = `已作答 ${answeredCount} / ${currentQuestions.length} 題`;
    }

    function renderNavigatorAndQuestions() {
      // Navigator
      questionNavGrid.innerHTML = currentQuestions
        .map((q, idx) => {
          const displayNo = idx + 1;
          const chosen = userAnswers[q.id];
          let cls = "nav-btn";
          if (isSubmitted) {
            if (chosen === q.answer) {
              cls += " correct-q";
            } else {
              cls += " wrong-q";
            }
          } else if (chosen) {
            cls += " answered";
          }
          return `<button type="button" class="${cls}" data-q-index="${idx}" title="跳轉至第 ${displayNo} 題">${displayNo}</button>`;
        })
        .join("");

      // Questions
      questionsContainer.innerHTML = currentQuestions
        .map((q, idx) => {
          const displayNo = idx + 1;
          const chosen = userAnswers[q.id];
          const isCorrect = isSubmitted && chosen === q.answer;
          const isWrong = isSubmitted && chosen !== q.answer;

          if (isSubmitted && currentFilter === "WRONG" && isCorrect) {
            return "";
          }

          let cardClass = "q-card";
          if (isSubmitted) {
            cardClass += isCorrect ? " is-correct" : " is-wrong";
          }

          const optionsHtml = q.shuffledOptions
            .map((opt, optIdx) => {
              const labelChar = String.fromCharCode(65 + optIdx);
              let optClass = "option-item";
              if (isSubmitted) {
                optClass += " disabled";
                if (opt === q.answer) {
                  optClass += " correct-answer";
                } else if (opt === chosen && opt !== q.answer) {
                  optClass += " wrong-choice";
                }
              } else if (chosen === opt) {
                optClass += " selected";
              }

              return `
                <div class="${optClass}" data-qid="${q.id}" data-opt="${encodeURIComponent(opt)}">
                  <span><strong>(${labelChar})</strong> ${opt}</span>
                </div>
              `;
            })
            .join("");

          const distractorItems = Object.entries(q.distractorAnalysis)
            .map(([keyOpt, reason]) => `<li><strong>${keyOpt}</strong>：${reason}</li>`)
            .join("");

          const expClass = isSubmitted ? "explanation-box show" : "explanation-box";

          return `
            <article id="q-card-${q.id}" class="${cardClass}">
              <div class="q-top-row">
                <button type="button" class="q-badge" data-ref-id="${q.refCardId}" title="點擊查看左側對應文本">第 ${displayNo} 題</button>
                <span class="q-tag">${q.level}</span>
                <span class="q-tag">${q.dimension}</span>
              </div>
              <div class="q-stem">${q.stem}</div>
              <div class="options-list">${optionsHtml}</div>

              <div class="${expClass}">
                <div class="exp-line"><span class="exp-label">【測驗卷原題目】</span>${q.stem}</div>
                <div class="exp-line"><span class="exp-label">【繁體中文翻譯】</span>${q.translation}</div>
                <div class="exp-line"><span class="exp-label">【答案】</span>${q.answer}</div>
                <div class="exp-line"><span class="exp-label">【核心考點說明】</span>${q.corePoint}</div>
                <div class="exp-line"><span class="exp-label">【考點歸類】</span>${q.dimension}（${q.category}）</div>
                <div class="exp-line"><span class="exp-label">【文法】</span>${q.grammarAnalysis}</div>
                <div class="exp-line">
                  <span class="exp-label">【干擾項、誘答剖析】</span>
                  <ul class="exp-sublist">${distractorItems}</ul>
                </div>
                <div class="exp-line"><span class="exp-label">【音標】</span>${q.phonetics}</div>
              </div>
            </article>
          `;
        })
        .join("");

      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      // Navigator click -> scroll to question
      questionNavGrid.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-q-index"), 10);
          const qObj = currentQuestions[idx];
          if (!qObj) return;
          const cardEl = document.getElementById(`q-card-${qObj.id}`);
          if (cardEl) {
            cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        });
      });

      // Option selection
      questionsContainer.querySelectorAll(".option-item:not(.disabled)").forEach((optEl) => {
        optEl.addEventListener("click", () => {
          if (isSubmitted) return;
          const qid = parseInt(optEl.getAttribute("data-qid"), 10);
          const optVal = decodeURIComponent(optEl.getAttribute("data-opt"));
          userAnswers[qid] = optVal;
          updateProgressText();
          renderNavigatorAndQuestions();
        });
      });

      // Question badge -> bidirectional link to left reference card
      questionsContainer.querySelectorAll(".q-badge").forEach((badgeEl) => {
        badgeEl.addEventListener("click", () => {
          const refId = badgeEl.getAttribute("data-ref-id");
          highlightRefCard(refId);
        });
      });
    }

    function computeDimensionStats() {
      const dims = ["字彙", "文法", "語意邏輯", "細節理解"];
      const statsMap = {};
      dims.forEach((d) => {
        statsMap[d] = { total: 0, correct: 0 };
      });

      currentQuestions.forEach((q) => {
        const d = dims.includes(q.dimension) ? q.dimension : "字彙";
        statsMap[d].total += 1;
        if (userAnswers[q.id] === q.answer) {
          statsMap[d].correct += 1;
        }
      });

      return dims.map((d) => {
        const { total, correct } = statsMap[d];
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        return { dimension: d, total, correct, rate };
      });
    }

    function renderRadarChart(dimStats) {
      const ctx = document.getElementById("radarChartCanvas").getContext("2d");
      if (radarChartInstance) {
        radarChartInstance.destroy();
      }
      radarChartInstance = new Chart(ctx, {
        type: "radar",
        data: {
          labels: dimStats.map((item) => item.dimension),
          datasets: [
            {
              label: "得分率 (%)",
              data: dimStats.map((item) => item.rate),
              fill: true,
              backgroundColor: "rgba(29, 78, 216, 0.2)",
              borderColor: "rgb(29, 78, 216)",
              pointBackgroundColor: "rgb(29, 78, 216)",
              pointBorderColor: "#fff"
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0,
              max: 100,
              ticks: {
                stepSize: 25
              }
            }
          }
        }
      });
    }

    function saveAttemptHistory(score, correctCount, totalCount, dimStats, wrongList) {
      const existing = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]");
      const record = {
        id: Date.now(),
        submittedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        elapsed: formatClock(elapsedSeconds),
        score,
        correctCount,
        totalCount,
        dimensions: dimStats,
        wrongIds: wrongList.map((w) => w.id)
      };
      existing.unshift(record);
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(existing.slice(0, 50)));
    }

    function submitExam(autoByTimeout = false) {
      if (isSubmitted) return;
      isSubmitted = true;
      submitExamBtn.disabled = true;

      const totalCount = currentQuestions.length;
      let correctCount = 0;
      const wrongList = [];

      currentQuestions.forEach((q, idx) => {
        const chosen = userAnswers[q.id];
        if (chosen === q.answer) {
          correctCount += 1;
        } else {
          wrongList.push({ ...q, displayNo: idx + 1, userChoice: chosen || "未作答" });
        }
      });

      const score = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
      const dimStats = computeDimensionStats();

      finalScoreText.textContent = `${score} 分`;
      finalStatsText.textContent = `答對 ${correctCount} / ${totalCount} 題｜耗時 ${formatClock(elapsedSeconds)}`;

      dimensionStatsBody.innerHTML = dimStats
        .map(
          (item) => `
            <tr>
              <td>${item.dimension}</td>
              <td>${item.correct} / ${item.total}</td>
              <td>${item.rate}%</td>
            </tr>
          `
        )
        .join("");

      summarySection.classList.add("visible");
      renderRadarChart(dimStats);
      renderNavigatorAndQuestions();
      saveAttemptHistory(score, correctCount, totalCount, dimStats, wrongList);

      if (autoByTimeout) {
        showToast("時間到，系統已自動提交試卷！");
      } else {
        showToast(`交卷完成！本次得分 ${score} 分`);
      }
    }

    submitExamBtn.addEventListener("click", () => {
      if (isSubmitted) return;
      const unanswered = currentQuestions.length - Object.keys(userAnswers).length;
      if (unanswered > 0) {
        const ok = confirm(`尚有 ${unanswered} 題未作答，確定要提交試卷嗎？`);
        if (!ok) return;
      }
      submitExam(false);
    });

    reshuffleExamBtn.addEventListener("click", () => {
      prepareShuffledExam();
      showToast("已重新洗牌題目與選項順序");
    });

    filterAllBtn.addEventListener("click", () => {
      currentFilter = "ALL";
      filterAllBtn.classList.add("active");
      filterWrongBtn.classList.remove("active");
      renderNavigatorAndQuestions();
    });

    filterWrongBtn.addEventListener("click", () => {
      currentFilter = "WRONG";
      filterWrongBtn.classList.add("active");
      filterAllBtn.classList.remove("active");
      renderNavigatorAndQuestions();
    });

    function buildWrongNotesMarkdown() {
      const lines = ["# 國中英語錯題複習筆記（Page 48–53）", ""];
      let hasWrong = false;
      currentQuestions.forEach((q, idx) => {
        const chosen = userAnswers[q.id];
        if (chosen !== q.answer) {
          hasWrong = true;
          lines.push(`## 第 ${idx + 1} 題（${q.dimension}｜${q.category}）`);
          lines.push(`- **原題目**：${q.stem}`);
          lines.push(`- **您的作答**：${chosen || "未作答"}｜**正確答案**：${q.answer}`);
          lines.push(`- **中文翻譯**：${q.translation}`);
          lines.push(`- **核心考點**：${q.corePoint}`);
          lines.push(`- **文法解析**：${q.grammarAnalysis}`);
          lines.push(`- **音標與連讀**：${q.phonetics}`);
          lines.push("");
        }
      });
      if (!hasWrong) {
        lines.push("太棒了！本次測驗全數答對，無錯題需要複習。");
      }
      return lines.join("\n");
    }

    copyWrongMdBtn.addEventListener("click", async () => {
      const md = buildWrongNotesMarkdown();
      try {
        await navigator.clipboard.writeText(md);
        showToast("已複製錯題筆記（Markdown 格式）");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = md;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("已複製錯題筆記（Markdown 格式）");
      }
    });

    downloadWordBtn.addEventListener("click", () => {
      const md = buildWrongNotesMarkdown();
      const htmlDoc = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office"
              xmlns:w="urn:schemas-microsoft-com:office:word"
              xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="utf-8"><title>錯題複習報告</title></head>
        <body><pre style="font-family: 'Microsoft JhengHei', sans-serif; white-space: pre-wrap;">${md.replace(/</g, "&lt;")}</pre></body>
        </html>
      `;
      const blob = new Blob(["\ufeff", htmlDoc], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "英文錯題複習筆記.doc";
      a.click();
      URL.revokeObjectURL(url);
      showToast("已下載 Word 錯題報告（.doc）");
    });

    // Secret Parent History Access (5 clicks on title OR Ctrl+Shift+P)
    function openParentHistoryModal() {
      const pwd = prompt("請輸入家長檢視密碼：");
      if (pwd !== PARENT_PASSWORD) {
        if (pwd !== null) showToast("密碼錯誤");
        return;
      }

      const records = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]");
      if (records.length === 0) {
        historyContentArea.innerHTML = "<p>目前尚無交卷歷史紀錄。</p>";
      } else {
        const rows = records
          .map(
            (r, idx) => `
              <tr>
                <td>${records.length - idx}</td>
                <td>${r.submittedAt}</td>
                <td>${r.elapsed}</td>
                <td><strong>${r.score} 分</strong>（${r.correctCount}/${r.totalCount}）</td>
                <td>${r.dimensions.map((d) => `${d.dimension}:${d.rate}%`).join("、")}</td>
                <td>${r.wrongIds.length > 0 ? r.wrongIds.join(", ") : "無"}</td>
              </tr>
            `
          )
          .join("");

        historyContentArea.innerHTML = `
          <p style="color: var(--text-secondary); font-size: 0.9rem;">累計交卷次數：<strong>${records.length}</strong> 次</p>
          <table class="history-table">
            <thead>
              <tr>
                <th>次序</th>
                <th>01. 交卷時間</th>
                <th>02. 耗時</th>
                <th>03. 得分</th>
                <th>04. 各維度統計</th>
                <th>05. 錯題題號</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }
      historyModal.classList.add("open");
    }

    mainTitle.addEventListener("click", () => {
      titleClickCount += 1;
      if (titleClickCount >= 5) {
        titleClickCount = 0;
        openParentHistoryModal();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        openParentHistoryModal();
      }
    });

    closeHistoryBtn.addEventListener("click", () => {
      historyModal.classList.remove("open");
    });

    // Secret Master Key Table (5 clicks on subtle ❖ in top-left)
    secretDiamond.addEventListener("click", () => {
      diamondClickCount += 1;
      if (diamondClickCount >= 5) {
        diamondClickCount = 0;
        const rows = currentQuestions
          .map(
            (q, idx) => `
              <tr>
                <td>第 ${idx + 1} 題</td>
                <td>${q.dimension}</td>
                <td>${q.stem}</td>
                <td><strong>${q.answer}</strong></td>
              </tr>
            `
          )
          .join("");

        masterKeyContentArea.innerHTML = `
          <table class="key-table">
            <thead>
              <tr>
                <th>題號</th>
                <th>考點</th>
                <th>題目摘要</th>
                <th>標準答案</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
        masterKeyModal.classList.add("open");
      }
    });

    closeMasterKeyBtn.addEventListener("click", () => {
      masterKeyModal.classList.remove("open");
    });

    // Initial Boot
    prepareShuffledExam();
  </script>
</body>
</html>
